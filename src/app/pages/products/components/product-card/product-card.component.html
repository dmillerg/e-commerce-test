<div class="card">
    <div class="card-header">{{product()?.title|shortDescription:20:true}}</div>
    <div class="card-body">
        <img [src]="product()?.image" [alt]="product()?.title" class="h-56 w-full object-contain m-2">
        <div class="flex justify-between items-center my-2">
            <span >{{product()?.category}}</span>

            <span >{{product()?.price|currency}}</span>
        </div>
        <p class="line-clamp-2">{{product()?.description}}</p>
    </div>
    <div class="card-footer">
        <button class="btn-primary"><i class="bi bi-cart3"></i> comprar</button>
    </div>
</div>
