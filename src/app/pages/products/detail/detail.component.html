<main class="flex-1">
    <div class="container px-4 py-8 md:px-6 md:py-12 mx-auto">

        @if(product){
        <div class="grid grid-cols-1 md:grid-cols-2 gap-8 lg:gap-12">
            <div class="space-y-4">
                <div
                    class="relative aspect-square overflow-hidden rounded-lg border border-gray-300 flex justify-center items-center">
                    <img [src]="product.image || '/placeholder.svg'"
                        [alt]="product.title" class="object-cover" />
                </div>
            </div>

            <div class="flex flex-col gap-6">
                <div>
                    <span class="text-sm text-muted-foreground">{{product.category}}</span>
                    <h1 class="text-3xl font-bold">{{ product.title }}</h1>
                    <div class="flex items-center gap-4 mt-2">
                        <div class="flex items-center text-violet-500">
                            <app-ratings [currentRating]="product.rating.rate" />
                            <div class="text-sm text-muted-foreground flex gap-1 ml-2"> <span>{{product.rating.rate}}</span> <span>({{product.rating.count}} reseñas)</span></div>
                        </div>
                    </div>
                </div>

                <div class="flex items-baseline gap-2">
                    <span class="text-3xl font-bold text-violet-500">{{ product.price|currency }}</span>
                </div>

                <div class="w-full border-gray-200 border-t"></div>

                <div class="">
                    <p class="text-muted-foreground">{{ product.description }}</p>
                </div>

                <div class="w-full border-gray-200 border-t"></div>

                <div class="flex flex-col gap-4">
                    <div class="flex items-center">
                        <span class="text-sm font-medium mr-4">Cantidad:</span>
                        <div class="flex items-center border border-gray-200 rounded-md ">
                            <button class="h-9 w-9 rounded-none cursor-pointer" (click)="handleDecreaseQuantity()"
                                [disabled]="quantity <= 1">
                                -
                            </button>
                            <span class="w-12 text-center">{{ quantity }}</span>
                            <button class="h-9 w-9 rounded-none cursor-pointer" (click)="handleIncreaseQuantity()"
                               >
                                +
                            </button>
                        </div>

                    </div>

                    <div class="grid grid-cols-2 gap-4 pt-4">
                        <div class="flex items-center gap-2">
                            <i class="bi bi-truck text-violet-500"></i>
                            <div>
                                <p class="text-sm font-medium">Envios veloces</p>
                                <p class="text-xs text-muted-foreground">Su pedido lo enviamos hoy</p>
                            </div>
                        </div>
                        <div class="flex items-center gap-2">
                            <i class="bi bi-shield text-violet-500"></i>
                            <div>
                                <p class="text-sm font-medium">Garantía de Calidad</p>
                                <p class="text-xs text-muted-foreground">Satisfacción garantizada</p>
                            </div>
                        </div>
                    </div>

                    <button [disabled]="!isLog" class=" w-full btn-primary" (click)="addCart()">
                        Añadir al carrito
                    </button>

                </div>
            </div>

        </div>
        }@else {
        <div class="grid grid-cols-1 md:grid-cols-2 gap-8 lg:gap-12 animate-pulse">
            <div class="h-full w-full bg-gray-300/40 rounded-lg"></div>
            <div class="flex flex-col gap-4">
                <div class="h-6 w-1/3 bg-gray-300/40 rounded-lg"></div>
                <div class="h-12 w-full bg-gray-300/40 rounded-lg"></div>
                <div class="h-12 w-1/3 bg-gray-300/40 rounded-lg mt-4"></div>
                <div class="border-t border-gray-300"></div>
                <div class="h-8 w-full bg-gray-300/40 rounded-lg"></div>
                <div class="h-8 w-full bg-gray-300/40 rounded-lg"></div>
                <div class="h-8 w-full bg-gray-300/40 rounded-lg"></div>
                <div class="h-8 w-2/3 bg-gray-300/40 rounded-lg"></div>
                <div class="border-t border-gray-300"></div>
                <div class="h-12 w-1/3 bg-gray-300/40 rounded-lg"></div>
                <div class="flex items-center gap-4">
                    <div class="h-12 flex-1 bg-gray-300/40 rounded-lg"></div>
                    <div class="h-12 flex-1 bg-gray-300/40 rounded-lg"></div>
                </div>
                <div class="h-12 w-full bg-gray-300/40 rounded-lg mt-4"></div>

            </div>
        </div>
        }
    </div>
</main>
