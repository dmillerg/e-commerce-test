
<div class="flex flex-col min-h-screen w-full">
    <div class="container w-full px-3 md:px-[0] py-8 md:py-12 mx-auto">
        <div class="mb-8 ">
            <h1 class="text-3xl font-bold tracking-tight text-violet-500">Carrito de compras</h1>
            <p class="mt-2 text-muted-foreground">
                {{ cantProducts() }} productos en tu carrito
            </p>
        </div>

        <div class="w-full shrink-0">
            <div class="flex flex-col lg:flex-row gap-8 ">
                
                <div class="flex flex-col flex-1 gap-4">
                    @for (item of cart?.products; track $index) {
                    <a [routerLink]="['/products', 'detail', item.productId]"
                        class="border border-gray-200 rounded-lg shadow p-6 flex gap-3 items-center hover:shadow-md transition-all duration-300">
                        <img src="" class="h-20 w-20 rounded-lg" alt="" />
                        <div class="flex flex-col flex-1">
                            Cantidad: {{ item.quantity }}
                        </div>
                        <div class="flex flex-col gap-2 items-end">
                            <i class="bi bi-x"></i>
                            <span class="font-semibold text-lg">
                                {{ (item.price ?? 0) * item.quantity | currency }}
                            </span>
                            <span class="text-muted-foreground text-sm">
                                {{ (item.price ?? 0) | currency }}
                            </span>
                        </div>
                    </a>
                    }
                    @empty {
                    <div class="flex justify-center items-center text-center text-muted-foreground min-h-60">
                        No hay productos en tu carrito
                    </div>
                    }
                </div>
                <div class="md:sticky top-24 space-y-6  md:w-80">
                    <app-cart-resume [subtotal]="subtotal"></app-cart-resume>
                </div>
            </div>

        </div>
    </div>
