<div class="grid gap-8 grid-cols-1 md:grid-cols-2 md:mt-20 px-4 md:px-0">
    <div class="rounded-lg border border-gray-400/20 w-full h-96 group relative  transition-all duration-500" >
        <img appFallbackImagesTs [src]="avatarSrc" alt="Mi avatar del perfil" class="w-full h-full object-contain">
        <input #file type="file" accept="image/*" class="hidden" (change)="onFileSelected($event)">
        <div class="opacity-0 backdrop-blur-md group-hover:opacity-100 absolute w-full h-full bg-gray-700/20  top-0 left-0 rounded-lg transition-all duration-500 flex items-center justify-center gap-3">
            <button appTooltip="Cambiar imagen" class="btn-primary " (click)="file.click()"><i class="bi bi-pencil"></i></button>
            <button appTooltip="Eliminar imagen" class="btn-primary " (click)="removeImg()"><i class="bi bi-trash"></i></button>
        </div>
    </div>
    <div class="flex flex-col gap-6 min-h-96  pb-4">
        <form class="flex flex-col gap-3 " [formGroup]="frm" (ngSubmit)="submit()">
            <h2 class="text-3xl font-bold text-violet-500">Hola, {{userStore.getUser()?.name}}</h2>
            <span class="text-muted-foreground">Estos son los datos disponibles actualmente en tu perfil.</span>

            <div class="text-muted-foreground">
                <label for="name">Nombre completo</label>
                <input appErrorHighlight formControlName="name" type="text" id="name" name="name" placeholder="Ingrese su nombre completo"
                    class="form-control">
            </div>
            <div class="text-muted-foreground" appTooltip="Correo válido">
                <label for="email">Correo</label>
                <input appErrorHighlight formControlName="email" type="text" id="email" name="email"
                    placeholder="ej: usuario@ecommerce.com" class="form-control is-success">
            </div>
            <div class="text-muted-foreground" >
                <label for="address">Direccion</label>
                <textarea appErrorHighlight formControlName="address" type="text" id="address" name="address"
                    placeholder="ej: Calle 3ra #22 e/Camino a y b" class="form-control"></textarea>
            </div>
            <span class="text-muted-foreground">Utiliza los campos a continuación para establecer o actualizar tu contraseña.</span>
              <div class="text-muted-foreground">
                <label for="password">Contraseña</label>
                <input appErrorHighlight [type]="showPassword?'text':'password'" id="password" name="password" formControlName="password" placeholder="******" class="form-control">
            </div>
            <div class="text-muted-foreground">
                <label for="confirm">Confirmar Contraseña</label>
                <input appErrorHighlight [type]="showConfirm?'text':'password'" id="confirm" name="confirm" formControlName="confirm" placeholder="*******" class="form-control">
            </div>
            <button [disabled]="loadingEdit" class="btn-primary mt-3" type="submit">
                {{loadingEdit?'Guardando cambios...':'Guardar cambios'}}
            </button>
        </form>

    </div>


</div>
