<div class="grid gap-4 grid-cols-1 md:grid-cols-2 md:mt-40 px-4 md:px-0">
  <div class="flex flex-col gap-3 min-h-96 order-2 md:order-1 pb-4">
    <h2 class="text-3xl font-bold text-violet-500">Contáctanos cuando lo necesites</h2>
    <span class="text-muted-foreground">Siempre listos para responderte, sin importar la hora</span>
    <div class="flex gap-3">
      <i class="bi bi-phone text-violet-500"></i>
      <span class="text-muted-foreground">+53 54600851</span>
    </div>
    <div class="flex gap-3">
      <i class="bi bi-geo-alt text-violet-500"></i>
      <span class="text-muted-foreground">Calle 3ra, #121 e/ B y Camino de la Virgen, Rpto Modelo Habana</span>
    </div>
    <form class="flex flex-col gap-3">
      <div>
        <label for="message" class="text-muted-foreground">Mensaje</label>
        <textarea [(ngModel)]="message" name="message" id="message" class="form-control" rows="8"
          placeholder="Ingrese el mensaje que usted desee para el desarrollador..."></textarea>
      </div>
      <a [href]="message ? contactWhatsapp() : null" [class.opacity-50]="!message"
        [style.pointer-events]="!message ? 'none' : 'auto'" class="w-fit btn-primary flex gap-2 uppercase">
        <i class="bi bi-whatsapp"></i>
        <span>Escríbenos</span>
      </a>
    </form>
  </div>

  <div class="w-full min-h-96 h-full border border-gray-300 rounded-lg overflow-hidden order-1 md:order-2">
    <iframe src="https://www.google.com/maps?q=23.116912,-82.327698&hl=es&z=15&output=embed"
      width="100%" height="100%" style="border:0;" allowfullscreen="" loading="lazy"
      referrerpolicy="no-referrer-when-downgrade">
    </iframe>
  </div>
</div>
