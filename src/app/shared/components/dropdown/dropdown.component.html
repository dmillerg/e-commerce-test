<div class="flex flex-col gap-2">
    <div class="relative">
      <select (change)="selectOption($event)" id="options" name="options" class="appearance-none w-full px-4 py-2 pr-10 form-control rounded-lg shadow-sm text-gray-700  focus:outline-none">
        <option value="" disabled selected>Selecciona...</option>
        @for (option of options; track $index) {
          <option class="hover:bg-amber-100" [value]="option.value">{{option.name}}</option>
        }
      </select>
      <div class="absolute inset-y-0 right-0 flex items-center pr-3 pointer-events-none">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5 text-gray-500" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" />
        </svg>
      </div>
    </div>
  </div>
